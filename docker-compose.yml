services:
  metacritic-ai:
    build: .
    container_name: metacritic-ai-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - HEADLESS=true
      - EXECUTABLE_PATH=/usr/bin/chromium
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/metacritic_ai
    volumes:
      - ./data:/app/data
      - ./ai_chat_logs:/app/ai_chat_logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: metacritic-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metacritic_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metacritic_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
