services:
  metacritic-ai:
    build: .
    container_name: metacritic-ai-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - HEADLESS=true
      - EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - ./data:/app/data
      - ./ai_chat_logs:/app/ai_chat_logs
